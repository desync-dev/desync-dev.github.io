<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>desync</title>
	<meta name="description" content="desync — software development.">
	<link rel="icon" type="image/png" href="desync.png">
	<style>
		:root {
			--bg:      #0a0a0b;
			--panel:   #101012;
			--line:    #26262b;
			--ink:     #e6e6e8;
			--muted:   #8a8a92;
			--faint:   #56565e;
			--red:     #dc3726;
			--red-dim: #6e231a;
			--mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
		}

		* { box-sizing: border-box; }

		html, body { height: 100%; }

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font-family: var(--mono);
			font-size: 14px;
			line-height: 1.6;
			-webkit-font-smoothing: antialiased;
			/* faint blueprint grid */
			background-image:
				linear-gradient(var(--line) 1px, transparent 1px),
				linear-gradient(90deg, var(--line) 1px, transparent 1px);
			background-size: 28px 28px;
			background-position: -1px -1px;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 32px 20px;
		}

		/* dim the grid toward a vignette so it reads as texture, not noise */
		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background: radial-gradient(ellipse 80% 70% at 50% 40%, transparent 0%, var(--bg) 100%);
			pointer-events: none;
		}

		.frame {
			position: relative;
			width: 100%;
			max-width: 460px;
			background: var(--panel);
			border: 1px dashed var(--line);
			padding: 40px 36px 32px;
		}

		/* ASCII corner markers */
		.frame > .corner {
			position: absolute;
			color: var(--red);
			font-size: 14px;
			line-height: 1;
			width: 14px;
			height: 14px;
			text-align: center;
		}
		.corner.tl { top: -7px; left: -7px; }
		.corner.tr { top: -7px; right: -7px; }
		.corner.bl { bottom: -7px; left: -7px; }
		.corner.br { bottom: -7px; right: -7px; }

		.brand {
			display: flex;
			align-items: center;
			gap: 14px;
			margin-bottom: 4px;
		}
		.brand img {
			width: 46px;
			height: 46px;
			border-radius: 8px;
			display: block;
		}
		.brand .name {
			font-size: 22px;
			font-weight: 600;
			letter-spacing: -0.02em;
			color: var(--ink);
		}
		.brand .name b { color: var(--red); font-weight: 600; }

		.tagline {
			color: var(--muted);
			margin: 0;
		}
		.tagline .cursor {
			display: inline-block;
			width: 8px;
			height: 1em;
			background: var(--red);
			vertical-align: -2px;
			margin-left: 2px;
		}

		/* ASCII box-drawing divider */
		.rule {
			color: var(--faint);
			white-space: nowrap;
			overflow: hidden;
			user-select: none;
			margin: 22px 0;
			font-size: 13px;
			line-height: 1;
		}

		.label {
			color: var(--red);
			font-size: 11px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			margin-bottom: 10px;
		}

		.rows { display: grid; gap: 7px; }
		.row {
			display: grid;
			grid-template-columns: 64px 1fr;
			gap: 12px;
			align-items: baseline;
		}
		.row .k { color: var(--faint); }
		.row .v { color: var(--ink); word-break: break-all; }

		a {
			color: var(--ink);
			text-decoration: none;
			border-bottom: 1px solid var(--red-dim);
			transition: border-color .15s, color .15s;
		}
		a:hover { color: var(--red); border-bottom-color: var(--red); }

		footer {
			margin-top: 28px;
			color: var(--faint);
			font-size: 11px;
			letter-spacing: 0.04em;
		}
	</style>
</head>
<body>
	<main class="frame">
		<span class="corner tl">+</span>
		<span class="corner tr">+</span>
		<span class="corner bl">+</span>
		<span class="corner br">+</span>

		<div class="brand">
			<img src="desync.png" alt="desync logo">
			<span class="name"><b>de</b>sync</span>
		</div>

		<p class="tagline">software development.<span class="cursor"></span></p>

		<div class="rule">├─────────────────────────────────────────────┤</div>

		<div class="label">// contact</div>
		<div class="rows">
			<div class="row">
				<span class="k">email</span>
				<span class="v"><a href="#contact" class="email" data-e="4b3f232221380b2f2e38322528652f2e3d">[email&#160;protected]</a></span>
			</div>
		</div>

		<div class="rule">├─────────────────────────────────────────────┤</div>

		<div class="label">// information</div>
		<div class="rows">
			<div class="row"><span class="k">coc</span><span class="v">78109922</span></div>
			<div class="row"><span class="k">vat</span><span class="v">NL003286554B73</span></div>
			<div class="row"><span class="k">iban</span><span class="v">NL89REVO8915788907</span></div>
		</div>

		<footer>© desync.dev · Netherlands</footer>
	</main>

	<script>
		document.querySelectorAll("a.email[data-e]").forEach(function (a) {
			var e = a.getAttribute("data-e");
			var key = parseInt(e.substr(0, 2), 16);
			var addr = "";
			for (var i = 2; i < e.length; i += 2) {
				addr += String.fromCharCode(parseInt(e.substr(i, 2), 16) ^ key);
			}
			a.href = "mailto:" + addr;
			a.textContent = addr;
			a.removeAttribute("data-e");
		});
	</script>
</body>
</html>
